name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Apply uploaded source changes
        run: |
          if [ -f LocalCastPro-changes.patch ]; then
            git apply LocalCastPro-changes.patch
            rm LocalCastPro-changes.patch
            git add -A
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add phone-to-phone casting, QR pairing, and opt-in remote control'
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests and build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LocalCastPro-1.1.0-dev.apk
      - uses: actions/upload-artifact@v7
        with:
          name: LocalCastPro-1.1.0-dev
          path: LocalCastPro-1.1.0-dev.apk
          if-no-files-found: error
      - name: Publish APK as prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          基于 cwe88108/LocalCastPro 的衍生版本。感谢原作者 cwe88108，并保留原仓库的 Apache License 2.0 许可及提交历史。

          新增同一 Wi-Fi 下的二维码配对、手机间屏幕控制，并修复部分设备显示 0.0.0.0 及发现失败的问题。

          两台手机都安装此 APK。此包是调试签名的预览版，包名为 com.localcast.pro.dev，可与原版共存。控制功能须由被控手机在每次会话中明确授权，并启用本应用的无障碍服务。当前未经真机双机验证。
          EOF
          if gh release view v1.1.0-dev >/dev/null 2>&1; then
            gh release upload v1.1.0-dev LocalCastPro-1.1.0-dev.apk --clobber
          else
            gh release create v1.1.0-dev LocalCastPro-1.1.0-dev.apk --target "$(git rev-parse HEAD)" --title 'LocalCastPro 1.1.0-dev（双机投屏控制预览版）' --notes-file release-notes.md --prerelease
          fi
