name: Build LocalCastCtrl 1.1.5-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests and build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # CI uses its own debug key. The release APK is uploaded separately so
      # users can update the earlier locally signed experiment build.
      - name: Prepare CI APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LocalCastCtrl-1.1.5-dev-ci.apk
      - uses: actions/upload-artifact@v7
        with:
          name: LocalCastCtrl-1.1.5-dev-ci
          path: LocalCastCtrl-1.1.5-dev-ci.apk
          if-no-files-found: error
